name: Run HPB Scraper

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and rebuild sqlite3
        run: |
          npm install
          npm rebuild sqlite3

      - name: Install Puppeteer Browser
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        run: node n9.js

      - name: Commit and push changes to database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated inventory update: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
