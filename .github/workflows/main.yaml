name: Run n9.js

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-node-script:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and rebuild sqlite3
      run: |
        npm install
        npm rebuild sqlite3
    - name: Install Puppeteer Browser
      run: npx puppeteer browsers install chrome

    - name: Run script
      run: node n9.js

    - name: Upload debug screenshot
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: page-screenshot
        path: debug-page.png

    - name: Commit and push changes to database
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Automated inventory update: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
        git push
