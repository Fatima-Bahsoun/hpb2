name: Run n9.js

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-node-script:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and rebuild sqlite3
      run: |
        npm install
        npm rebuild sqlite3
    - name: Install Puppeteer Browser
      run: npx puppeteer browsers install chrome

    - name: Run script
      run: node n9.js
